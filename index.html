<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Étrend</title>
<meta name="description" content="Heti longevity étrend – választás, bevásárlólista, főzés mód">
<meta name="theme-color" content="#f5f3ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101311" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Étrend">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180">
<style>
:root{
  --bg:#f5f3ee;--surface:#ffffff;--surface2:#eeebe3;--text:#1c211e;--muted:#68706a;--line:#e1ddd3;
  --accent:#2f6b4f;--accent-ink:#ffffff;--accent-soft:#e0ece4;--star:#b97f00;--star-soft:#fbf0d4;
  --warn:#b4501a;--warn-soft:#fbe8da;--ok:#2f7a4a;--band:rgba(47,107,79,.18);
  --shadow:0 1px 2px rgba(0,0,0,.05),0 3px 10px rgba(0,0,0,.04);
  --r:14px;--tabh:62px;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#101311;--surface:#191e1b;--surface2:#232a25;--text:#e7ebe8;--muted:#9ba59e;--line:#2d3530;
  --accent:#6fc293;--accent-ink:#0c1a12;--accent-soft:#1f3529;--star:#f2b632;--star-soft:#3a2f14;
  --warn:#f0904f;--warn-soft:#3b2416;--ok:#6fc293;--band:rgba(111,194,147,.2);
  --shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101311;--surface:#191e1b;--surface2:#232a25;--text:#e7ebe8;--muted:#9ba59e;--line:#2d3530;
    --accent:#6fc293;--accent-ink:#0c1a12;--accent-soft:#1f3529;--star:#f2b632;--star-soft:#3a2f14;
    --warn:#f0904f;--warn-soft:#3b2416;--ok:#6fc293;--band:rgba(111,194,147,.2);
    --shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:var(--accent)}
h1,h2,h3{margin:0;line-height:1.2}
[hidden]{display:none!important}
.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(10px + var(--sat)) calc(16px + var(--sar)) 10px calc(16px + var(--sal));border-bottom:1px solid var(--line)}
.top h1{font-size:20px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.top .sub{color:var(--muted);font-size:13px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--surface2);color:var(--muted)}
main{padding:12px calc(16px + var(--sar)) calc(var(--tabh) + var(--sab) + 70px) calc(16px + var(--sal));max-width:720px;margin:0 auto}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--surface);border-top:1px solid var(--line);padding:0 var(--sar) var(--sab) var(--sal)}
.tabbar button{flex:1;height:var(--tabh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--muted);position:relative}
.tabbar button .ic{font-size:21px;line-height:1}
.tabbar button[aria-selected="true"]{color:var(--accent);font-weight:600}
.tabbar .badge{position:absolute;top:7px;left:calc(50% + 8px);min-width:17px;height:17px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--line);margin:0 0 10px}
.pad{padding:14px}
.sec-title{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:18px 2px 8px;display:flex;align-items:center;gap:8px}
.sec-title .r{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:500}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;align-items:center;gap:8px}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:8px 14px;border-radius:11px;background:var(--surface2);font-weight:600;font-size:14px;border:1px solid var(--line)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.ghost{background:transparent}
.btn.sm{min-height:34px;padding:5px 10px;font-size:13px;border-radius:9px}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.btn.danger{color:var(--warn)}
.btn:disabled{opacity:.45}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;min-height:36px;border-radius:9px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:10px 0}
.days button{border-radius:12px;padding:7px 0 6px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;font-size:12px;color:var(--muted);position:relative}
.days button b{font-size:16px;color:var(--text)}
.days button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.days button[aria-pressed="true"] b{color:var(--accent-ink)}
.days .tick{position:absolute;top:-5px;right:-3px;width:17px;height:17px;border-radius:50%;background:var(--ok);color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;border:2px solid var(--bg)}
.days .today::after{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;margin-top:2px}
.gauge{margin:8px 0 2px}
.gauge .lbl{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.track{position:relative;height:10px;border-radius:6px;background:var(--surface2);overflow:hidden}
.track .band{position:absolute;top:0;bottom:0;background:var(--band)}
.track .fill{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--accent)}
.track .fill.low{background:var(--warn)}
.warnbox{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:8px 10px;font-size:13px;margin-top:8px}
.mealhead{display:flex;align-items:baseline;gap:8px;margin:18px 2px 8px}
.mealhead h2{font-size:17px}
.mealhead .s{font-size:12px;color:var(--muted);margin-left:auto;text-align:right;max-width:60%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meal{overflow:hidden}
.meal.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset,var(--shadow)}
.meal.rec{}
.mh{display:block;width:100%;text-align:left;padding:12px 14px}
.mh .t{display:flex;gap:8px;align-items:flex-start}
.mh .nm{font-weight:650;font-size:16px;flex:1;min-width:0}
.mh .star{color:var(--star)}
.mh .chev{color:var(--muted);transition:transform .2s;font-size:14px;margin-top:2px}
.meal.open .chev{transform:rotate(180deg)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:3px;font-size:12px;padding:2px 7px;border-radius:7px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.chip.strong{color:var(--text);font-weight:600}
.selmark{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:13px;font-weight:700;flex:none}
.nova{color:#fff;font-weight:700;font-size:11px;padding:2px 6px;border-radius:6px}
.nova1{background:#2e7d32}.nova2{background:#7cb342}.nova3{background:#ef8c00}.nova4{background:#d32f2f}
.ns{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:5px;color:#fff;font-weight:800;font-size:12px}
.ns.B,.ns.C{color:#1c211e}
.mb{padding:0 14px 14px;border-top:1px solid var(--line)}
.why{margin:12px 0 10px;font-size:15px}
.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-bottom:12px}
.fact{background:var(--surface2);border-radius:10px;padding:7px 10px;font-size:13px}
.fact b{display:block;font-size:15px}
.mb h4{margin:14px 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.ing{list-style:none;margin:0;padding:0}
.ing li{display:flex;gap:10px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:15px}
.ing li:last-child{border-bottom:0}
.ing .q{margin-left:auto;color:var(--muted);white-space:nowrap}
.steps{margin:0;padding-left:22px}
.steps li{margin:6px 0;font-size:15px}
.steps .pm{color:var(--accent);font-weight:600;font-size:13px;white-space:nowrap}
.link{display:block;margin-top:10px;font-size:14px;word-break:break-word}
.actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.rate{display:flex;gap:6px;margin-top:8px}
.rate button{flex:1;min-height:36px;border-radius:9px;background:var(--surface2);font-size:13px;border:1px solid var(--line)}
.rate button.on{background:var(--accent-soft);border-color:var(--accent)}
.filters{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none;margin:0 -16px;padding-left:16px;padding-right:16px}
.filters::-webkit-scrollbar{display:none}
.fchip{flex:none;padding:6px 11px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--muted)}
.fchip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.selrow{display:flex;gap:8px;margin:4px 0 6px}
.selrow label{flex:1;font-size:12px;color:var(--muted)}
.selrow select{display:block;width:100%;margin-top:3px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:16px}
.prep .ph{display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;text-align:left}
.prep ol{list-style:none;margin:0;padding:0 14px 12px}
.prep li{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.cb{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:14px;color:transparent;background:var(--surface)}
.cb.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.done-txt{text-decoration:line-through;color:var(--muted)}
.notes{margin:0;padding:12px 14px 12px 32px}
.notes li{margin:3px 0;font-size:14px}
.shop-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line)}
.shop-row:first-of-type{border-top:0}
.shop-row .nm{font-weight:600}
.shop-row .src{font-size:12px;color:var(--muted);margin-top:1px}
.shop-row .qty{color:var(--muted);font-weight:500;margin-left:4px}
.iconbtn{flex:none;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2);font-size:17px}
.cat-h{padding:10px 12px 4px;font-size:13px;font-weight:700;color:var(--muted)}
.empty{text-align:center;padding:28px 18px}
.empty .big{font-size:40px}
.stat{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.stat:first-child{border-top:0}
.stat .v{font-size:22px;font-weight:750;min-width:66px}
.plantlist{display:flex;flex-wrap:wrap;gap:5px;padding:0 14px 12px}
.kchip{display:inline-flex;align-items:center;gap:6px;padding:5px 6px 5px 11px;border-radius:99px;background:var(--surface2);font-size:14px;margin:0 6px 6px 0}
.kchip button{width:22px;height:22px;border-radius:50%;background:var(--surface);font-size:12px}
textarea.paste,textarea.copybox{width:100%;min-height:120px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);padding:10px;font:13px/1.4 ui-monospace,Menlo,monospace;resize:vertical}
input.num{width:130px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);font-size:16px}
.field{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-top:1px solid var(--line)}
.field:first-child{border-top:0}
.overlay{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column}
.sheetwrap{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:88vh;border-radius:18px 18px 0 0;display:flex;flex-direction:column;padding-bottom:var(--sab)}
.sheet-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.sheet-h h2{font-size:17px;flex:1}
.sheet-b{overflow-y:auto;padding:12px 16px 18px;-webkit-overflow-scrolling:touch}
.swapitem{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line)}
.swapitem:first-child{border-top:0}
.cook-h{display:flex;align-items:center;gap:10px;padding:calc(10px + var(--sat)) calc(16px + var(--sar)) 10px calc(16px + var(--sal))}
.cook-h h2{flex:1;font-size:17px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{height:6px;background:var(--surface2);margin:0 16px;border-radius:4px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);transition:width .25s}
.cook-b{flex:1;overflow-y:auto;padding:18px calc(20px + var(--sar)) 18px calc(20px + var(--sal))}
.stepno{color:var(--muted);font-weight:700;font-size:14px;letter-spacing:.04em;text-transform:uppercase}
.steptxt{font-size:clamp(23px,6.2vw,32px);line-height:1.35;font-weight:560;margin:10px 0 18px}
.timerbtn{min-height:52px;font-size:17px;width:100%}
.cook-f{display:flex;gap:10px;padding:10px calc(16px + var(--sar)) calc(12px + var(--sab)) calc(16px + var(--sal));border-top:1px solid var(--line);background:var(--bg)}
.cook-f .btn{flex:1;min-height:56px;font-size:17px}
.tlist{display:flex;flex-direction:column;gap:6px;margin:14px 0}
.titem{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.titem .tt{font-variant-numeric:tabular-nums;font-weight:750;font-size:20px;min-width:72px}
.titem.done{background:var(--warn-soft);border-color:var(--warn);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.65}}
#timerbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabh) + var(--sab) + 10px);z-index:35;display:flex;gap:6px}
#timerbar button{background:var(--text);color:var(--bg);padding:8px 14px;border-radius:99px;font-weight:700;font-variant-numeric:tabular-nums;box-shadow:0 4px 14px rgba(0,0,0,.2)}
#timerbar button.done{background:var(--warn);color:#fff;animation:pulse 1s infinite}
#toasts{position:fixed;left:0;right:0;bottom:calc(var(--tabh) + var(--sab) + 60px);z-index:80;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;padding:0 16px}
.toast{background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;max-width:440px;box-shadow:0 6px 20px rgba(0,0,0,.25);animation:tin .2s ease-out}
.toast.alarm{background:var(--warn);color:#fff;font-size:16px}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
.bar2{height:8px;background:var(--surface2);border-radius:5px;overflow:hidden;margin-top:6px}
.bar2 i{display:block;height:100%;background:var(--accent)}
.bar2 i.over{background:var(--warn)}
.groupname{font-size:15px;font-weight:700;margin:18px 2px 8px;display:flex;gap:8px;align-items:baseline}
.groupname .c{color:var(--muted);font-weight:500;font-size:13px}
.ver{text-align:center;color:var(--muted);font-size:12px;margin-top:20px}
@media (min-width:600px){.facts{grid-template-columns:repeat(4,1fr)}}
/* ---- Claude AI ---- */
:root{--ai:#b4532a;--ai-ink:#ffffff;--ai-soft:#f8e7dd}
:root[data-theme="dark"]{--ai:#ec9a72;--ai-ink:#1d0f08;--ai-soft:#3b241a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ai:#ec9a72;--ai-ink:#1d0f08;--ai-soft:#3b241a}}
.btn.ai{background:var(--ai);color:var(--ai-ink);border-color:transparent}
.btn.ai-o{background:var(--ai-soft);color:var(--ai);border-color:transparent}
.aibox,.aibanner,.jobcard{border-color:var(--ai);box-shadow:0 0 0 1px var(--ai) inset,var(--shadow)}
.chip.ai-chip{background:var(--ai-soft);color:var(--ai);font-weight:600}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:rot .8s linear infinite;vertical-align:-2px;flex:none}
@keyframes rot{to{transform:rotate(360deg)}}
.txt{width:100%;padding:9px 11px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);font-size:16px}
.txt.short{width:150px;text-align:right}
textarea.txt{resize:vertical;line-height:1.4}
.field.col{flex-direction:column;align-items:stretch}
.lbl{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:14px 0 6px}
.note{font-size:13px;color:var(--muted);margin-top:12px;background:var(--surface2);border-radius:10px;padding:9px 11px}
.check{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-size:14px}
.check input{width:20px;height:20px;margin:0;flex:none;accent-color:var(--ai)}
.steprow{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:8px 0 4px}
.steprow b{color:var(--text)}
.bar2 i.jobbar{background:var(--ai);transition:width .3s}
.bubble{padding:10px 12px;border-radius:14px;margin:8px 0;max-width:88%;font-size:15px;line-height:1.45;width:fit-content}
.bubble.me{background:var(--accent);color:var(--accent-ink);margin-left:auto;border-bottom-right-radius:4px}
.bubble.bot{background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.tips{margin:0;padding-left:20px}.tips li{margin:4px 0;font-size:14px}
details.field summary{cursor:pointer;font-weight:600;padding:2px 0}
.ai-actions{margin-top:8px}
</style>
</head>
<body>
<header class="top">
  <h1><span>🥗 Étrend</span><span id="demoBadge" class="pill" hidden>DEMO</span></h1>
  <div class="sub" id="sub">Nincs betöltött terv</div>
</header>

<main>
  <section id="tab-het"></section>
  <section id="tab-bev" hidden></section>
  <section id="tab-snack" hidden></section>
  <section id="tab-tobb" hidden></section>
</main>

<div id="timerbar" hidden></div>
<div id="toasts" aria-live="polite"></div>

<nav class="tabbar" role="tablist">
  <button role="tab" data-act="tab" data-id="het" aria-selected="true"><span class="ic">📅</span>Hét</button>
  <button role="tab" data-act="tab" data-id="bev" aria-selected="false"><span class="ic">🛒</span>Bevásárlás<span class="badge" id="shopBadge" hidden></span></button>
  <button role="tab" data-act="tab" data-id="snack" aria-selected="false"><span class="ic">🥜</span>Snackek</button>
  <button role="tab" data-act="tab" data-id="tobb" aria-selected="false"><span class="ic">⚙️</span>Több</button>
</nav>

<div id="cook" class="overlay" hidden role="dialog" aria-modal="true" aria-label="Főzés mód"></div>
<div id="sheet" class="sheetwrap" hidden role="dialog" aria-modal="true"></div>

<input type="file" id="fileInput" accept=".json,application/json,text/plain" hidden>
<input type="file" id="restoreInput" accept=".json,application/json,text/plain" hidden>

<script>

function fmtQty(n, unit){
  if(n == null) return unit || '';
  let v;
  if(n >= 100) v = Math.round(n);
  else if(n >= 10) v = Math.round(n*2)/2;
  else v = round1(n);
  return String(v).replace('.', ',') + (unit ? ' ' + unit : '');
}

function weekKeyOf(p){ return p ? (p.ev + '-W' + String(p.het).padStart(2,'0')) : null; }
function isoWeek(d){
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day);
  const y0 = new Date(Date.UTC(t.getUTCFullYear(),0,1));
  return {ev: t.getUTCFullYear(), het: Math.ceil(((t - y0)/86400000 + 1)/7)};
}

/* ---------- normalizálás (ékezettűrő) ---------- */
function normKeys(o){
  if(!o || typeof o !== 'object' || Array.isArray(o)) return o || {};
  const r = {}; for(const k in o) r[strip(k).replace(/[\s-]+/g,'_')] = o[k]; return r;
}
function normDay(v){ const s = strip(v).replace(/[^a-z]/g,''); const d = DAYS.find(x => x[0] === s); return d ? d[0] : null; }
function normMeal(v){ const s = strip(v).replace(/[^a-z]/g,''); if(s.startsWith('regg')) return 'reggeli'; if(s.startsWith('eb')) return 'ebed'; if(s.startsWith('vacs')) return 'vacsora'; return null; }
function normDiff(v){ const s = strip(v); if(s.startsWith('konny')) return 'konnyu'; if(s.startsWith('kozep')) return 'kozepes'; if(s.startsWith('ossz') || s.startsWith('nehez')) return 'osszetett'; return null; }
function normCat(v){
  const s = strip(v);
  if(/zold|gyum/.test(s)) return 'zoldseg';
  if(/feher|hus|hal|tojas/.test(s)) return 'feherje';
  if(/tej|ferment|sajt|joghurt/.test(s)) return 'tejtermek';
  if(/gabon|huvely|rizs|teszta|kenyer/.test(s)) return 'gabona';
  return 'egyeb';
}
function normLink(l){
  if(!l) return null;
  if(typeof l === 'string') l = {url:l};
  l = normKeys(l);
  const url = String(l.url || '').trim();
  if(!/^https?:\/\/\S+$/i.test(url)) return null;
  return {url, cim: String(l.cim || l.title || url)};
}
function normSteps(a){
  if(!Array.isArray(a)) return [];
  return a.map(s => {
    if(typeof s === 'string') return {szoveg:s, perc:null};
    s = normKeys(s);
    return {szoveg: String(s.szoveg ?? s.text ?? ''), perc: num(s.perc)};
  }).filter(s => s.szoveg);
}
function normIngr(a){
  if(!Array.isArray(a)) return [];
  return a.map(i => {
    if(typeof i === 'string') return {nev:i.trim(), menny:null, egyseg:'', kategoria:'egyeb'};
    i = normKeys(i);
    return {nev:String(i.nev || '').trim(), menny:num(i.menny ?? i.mennyiseg), egyseg:String(i.egyseg || '').trim(), kategoria:normCat(i.kategoria)};
  }).filter(i => i.nev);
}
function normItem(m, idx, kind){
  m = normKeys(m);
  const ns = (String(m.nutriscore_becsult ?? m.nutriscore ?? '').trim().toUpperCase().match(/^[A-E]/) || [null])[0];
  const nova = num(m.nova);
  const o = {
    id: String(m.id || '').trim(), kind,
    nap: normDay(m.nap), etkezes: normMeal(m.etkezes), ajanlott: bool(m.ajanlott),
    nev: String(m.nev || 'Névtelen').trim(), konyha: String(m.konyha || '').trim(), feherjeforras: String(m.feherjeforras || '').trim(),
    ido_perc: num(m.ido_perc), nehezseg: normDiff(m.nehezseg), adag: num(m.adag) || (kind === 'snack' ? 1 : 2),
    feherje_g: num(m.feherje_g), kcal: num(m.kcal), rost_g: num(m.rost_g),
    nova: nova && nova >= 1 && nova <= 4 ? Math.round(nova) : null, nutriscore: ns,
    fermentalt: bool(m.fermentalt), maradek_holnapra: bool(m.maradek_holnapra), futonapra: bool(m.futonapra),
    koltseg_ft: num(m.koltseg_ft), miert: String(m.miert || ''),
    novenyek: Array.isArray(m.novenyek) ? m.novenyek.map(x => String(x).trim()).filter(Boolean) : [],
    alapanyagok: normIngr(m.alapanyagok), lepesek: normSteps(m.lepesek), link: normLink(m.link),
    eltarthatosag: String(m.eltarthatosag || ''), tarolas: String(m.tarolas || ''),
    ai: bool(m.ai), reszletes: bool(m.reszletes), link_keresve: bool(m.link_keresve),
    tippek: Array.isArray(m.tippek) ? m.tippek.map(String).filter(Boolean) : [],
    helyettesitesek: Array.isArray(m.helyettesitesek) ? m.helyettesitesek.map(String).filter(Boolean) : [],
    lepesek_eredeti: Array.isArray(m.lepesek_eredeti) ? normSteps(m.lepesek_eredeti) : null
  };
  if(kind !== 'etel'){ o.nap = null; if(kind === 'snack') o.etkezes = null; }
  return o;
}
function normalizePlan(raw){
  if(typeof raw === 'string'){
    let s = raw.trim().replace(/^```(?:json)?\s*/i, '').replace(/```\s*$/, '').trim();
    const a = s.indexOf('{'), b = s.lastIndexOf('}');
    if(a > 0 && b > a) s = s.slice(a, b+1);
    raw = JSON.parse(s);
  }
  const p = normKeys(raw);
  if(!Array.isArray(p.etelek)) throw new Error('Nem találom az „etelek” listát – ez nem étrend-JSON.');
  const etelek = [], tartalekok = [];
  p.etelek.forEach((m, i) => {
    const it = normItem(m, i, 'etel');
    if(it.nap && it.etkezes) etelek.push(it);
    else if(it.etkezes){ it.kind = 'tartalek'; it.nap = null; tartalekok.push(it); }
  });
  (Array.isArray(p.tartalekok) ? p.tartalekok : []).forEach((m, i) => { const it = normItem(m, i, 'tartalek'); if(it.etkezes) tartalekok.push(it); });
  const snackek = (Array.isArray(p.snackek) ? p.snackek : []).map((m, i) => normItem(m, i, 'snack'));
  // egyedi id-k
  const seen = new Set();
  const fix = (it, pref) => {
    let id = it.id || (pref + '-' + (it.nap || '') + '-' + (it.etkezes || '') );
    id = id.replace(/\s+/g, '-');
    let k = id, n = 1; while(seen.has(k)) k = id + '-' + (++n);
    seen.add(k); it.id = k;
  };
  etelek.forEach(x => fix(x, 'etel')); tartalekok.forEach(x => fix(x, 'tartalek')); snackek.forEach(x => fix(x, 'snack'));
  // a "nap+étkezés" hármasban ha nincs ajánlott, az első legyen az
  for(const [d] of DAYS) for(const [m] of MEALS){
    const g = etelek.filter(x => x.nap === d && x.etkezes === m);
    if(g.length && !g.some(x => x.ajanlott)) g[0].ajanlott = true;
  }
  const cel = normKeys(p.napi_cel);
  let ev = num(p.ev), het = num(p.het);
  const kd = String(p.kezdo_datum || '').slice(0,10);
  if(!ev || !het){ const w = isoWeek(/^\d{4}-\d{2}-\d{2}$/.test(kd) ? new Date(kd + 'T12:00:00') : new Date()); ev = ev || w.ev; het = het || w.het; }
  const mp = normKeys(p.meal_prep);
  return {
    ev, het, kezdo_datum: /^\d{4}-\d{2}-\d{2}$/.test(kd) ? kd : '', generalva: String(p.generalva || ''),
    tema: String(p.tema || ''), demo: bool(p.demo), ai: bool(p.ai),
    megjegyzesek: (Array.isArray(p.megjegyzesek) ? p.megjegyzesek : (p.megjegyzesek ? [p.megjegyzesek] : [])).map(String).filter(Boolean),
    napi_cel: {feherje_min: num(cel.feherje_min) || 81, feherje_max: num(cel.feherje_max) || 104, kcal_min: num(cel.kcal_min) || 2100, kcal_max: num(cel.kcal_max) || 2300},
    futonap_tipp: String(p.futonap_tipp || ''),
    meal_prep: {ido_perc: num(mp.ido_perc), lepesek: (Array.isArray(mp.lepesek) ? mp.lepesek : []).map(s => {
      if(typeof s === 'string') return {szoveg:s, tarolas:'', felhasznalas:''};
      s = normKeys(s); return {szoveg:String(s.szoveg || ''), tarolas:String(s.tarolas || ''), felhasznalas:String(s.felhasznalas || '')};
    }).filter(s => s.szoveg)},
    etelek, tartalekok, snackek
  };
}

function rebuildIndex(){
  MI = {};
  if(!plan) return;
  [...plan.etelek, ...plan.tartalekok, ...plan.snackek].forEach(x => MI[x.id] = x);
}
function ensureWeekState(){
  const k = weekKeyOf(plan);
  const demo = !!plan.demo;
  const gen = plan.generalva || '';
  if(sel && sel.week === k && !!sel.demo === demo && sel.gen === undefined){ sel.gen = gen; store.set('sel', sel); }
  // új terv ugyanarra a hétre (pl. újragenerálás) → a régi választások már más ételekre mutatnának
  if(!sel || sel.week !== k || !!sel.demo !== demo || sel.gen !== gen){ sel = {week:k, demo, gen, slots:{}, swaps:{}, snacks:[], prep:{}}; store.set('sel', sel); }
  if(!checks || checks.week !== k || !!checks.demo !== demo){ checks = {week:k, demo, items:{}}; store.set('checks', checks); }
  // érvénytelen hivatkozások takarítása (pl. ugyanarra a hétre újragenerált terv)
  for(const s in sel.swaps) sel.swaps[s] = (sel.swaps[s] || []).filter(id => MI[id]);
  for(const s in sel.slots){
    const m = MI[sel.slots[s]]; const [d, e] = s.split('-');
    const ok = m && m.kind !== 'snack' && ((m.nap === d && m.etkezes === e) || (sel.swaps[s] || []).includes(m.id));
    if(!ok) delete sel.slots[s];
  }
  sel.snacks = (sel.snacks || []).filter(id => MI[id]);
}
function saveSel(){ store.set('sel', sel); upsertHistory(); }
function upsertHistory(){
  if(!plan || plan.demo) return;
  const key = weekKeyOf(plan);
  const names = Object.values(sel.slots).map(id => MI[id] && MI[id].nev).filter(Boolean);
  const e = {key, ev:plan.ev, het:plan.het, tema:plan.tema, valasztott:[...new Set(names)]};
  history = history.filter(h => h.key !== key);
  history.push(e);
  history.sort((a,b) => a.key < b.key ? -1 : 1);
  history = history.slice(-12);
  store.set('history', history);
}
function loadPlan(raw, quiet){
  const p = normalizePlan(raw);
  const total = p.etelek.length + p.tartalekok.length + p.snackek.length;
  if(!total) throw new Error('A tervben nincs egyetlen étel sem.');
  plan = p; store.set('plan', plan);
  rebuildIndex(); ensureWeekState(); upsertHistory();
  ui.day = defaultDay(); ui.open = []; saveUI();
  renderAll();
  if(!quiet) toast(`Betöltve: ${p.ev}/${p.het}. hét · ${p.etelek.length} étel, ${p.tartalekok.length} tartalék, ${p.snackek.length} snack`);
  return p;
}
function defaultDay(){
  const t = todayDay();
  if(!plan) return t;
  if(plan.etelek.some(x => x.nap === t)) return t;
  const f = DAYS.find(d => plan.etelek.some(x => x.nap === d[0]));
  return f ? f[0] : t;
}
async function fetchServerWeek(manual){
  try{
    const r = await fetch('week.json?t=' + Date.now(), {cache:'no-store'});
    if(!r.ok) throw new Error('HTTP ' + r.status);
    const txt = await r.text();
    const p = normalizePlan(txt);
    const newer = p.generalva && (!plan || !plan.generalva || Date.parse(p.generalva) > Date.parse(plan.generalva));
    const same = plan && plan.generalva === p.generalva && weekKeyOf(plan) === weekKeyOf(p);
    const should = manual || !plan || (plan.demo && !same) || (newer && !same);
    if(should){ loadPlan(txt, true); toast(manual ? 'Terv újratöltve a szerverről' : `Új heti terv a szerverről: ${p.ev}/${p.het}. hét`); }
    else if(manual) toast('A szerveren nincs újabb terv');
  }catch(e){
    if(manual) toast('Nem érhető el week.json a szerveren');
  }
}

/* ---------- számítások ---------- */
function slotKey(d, m){ return d + '-' + m; }
function slotMeals(d, m){
  const base = plan.etelek.filter(x => x.nap === d && x.etkezes === m);
  const rec = base.filter(x => x.ajanlott), rest = base.filter(x => !x.ajanlott);
  const extra = (sel.swaps[slotKey(d,m)] || []).map(id => MI[id]).filter(x => x && !base.includes(x));
  return [...rec, ...rest, ...extra];
}
function effMeal(d, m){
  const id = sel.slots[slotKey(d,m)];
  if(id && MI[id]) return {meal:MI[id], est:false};
  const r = plan.etelek.find(x => x.nap === d && x.etkezes === m && x.ajanlott);
  return r ? {meal:r, est:true} : null;
}
function dayStats(d){
  let p = 0, k = 0, est = 0, n = 0, ferm = false;
  for(const [m] of MEALS){ const e = effMeal(d, m); if(!e) continue; n++; if(e.est) est++; p += e.meal.feherje_g || 0; k += e.meal.kcal || 0; if(e.meal.fermentalt) ferm = true; }
  return {p, k, est, n, ferm};
}
function dayComplete(d){ return MEALS.every(([m]) => sel.slots[slotKey(d,m)]); }
function isSelected(id){ return Object.values(sel.slots).includes(id); }
function selectedMeals(){ return Object.entries(sel.slots).map(([s, id]) => ({slot:s, meal:MI[id]})).filter(x => x.meal); }
function factorFor(m){ return m.kind === 'snack' ? 1 : settings.fo / (m.adag || 2); }
function baseName(n){ return n.replace(/\s*\([^)]*\)/g, '').replace(/\s+/g,' ').trim(); }
function shoppingItems(){
  const map = new Map();
  const add = (ing, factor, src) => {
    const nev = baseName(ing.nev); const nk = strip(nev); const key = nk + '|' + strip(ing.egyseg);
    let it = map.get(key);
    if(!it){ it = {key, nk, nev, egyseg:ing.egyseg, kategoria:ing.kategoria, menny:0, hasQty:false, src:[]}; map.set(key, it); }
    if(ing.menny != null){ it.menny += ing.menny * factor; it.hasQty = true; }
    if(!it.src.includes(src)) it.src.push(src);
  };
  for(const {meal} of selectedMeals()){ const f = factorFor(meal); meal.alapanyagok.forEach(i => add(i, f, meal.nev)); }
  for(const id of sel.snacks){ const s = MI[id]; if(s) s.alapanyagok.forEach(i => add(i, 1, s.nev)); }
  return [...map.values()].sort((a,b) => a.nev.localeCompare(b.nev, 'hu'));
}
function inPantry(nk){ return pantry.some(p => strip(p) === nk); }
function costSelected(){
  let c = 0;
  for(const {meal} of selectedMeals()) c += (meal.koltseg_ft || 0) * factorFor(meal);
  for(const id of sel.snacks) c += (MI[id] && MI[id].koltseg_ft) || 0;
  return c;
}
function costWithRecommended(){
  let c = 0;
  for(const [d] of DAYS) for(const [m] of MEALS){ const e = effMeal(d, m); if(e) c += (e.meal.koltseg_ft || 0) * factorFor(e.meal); }
  for(const id of sel.snacks) c += (MI[id] && MI[id].koltseg_ft) || 0;
  return c;
}
function weekNumbers(){
  const plants = new Map(); let fermDays = 0, pSum = 0, pDays = 0;
  for(const [d] of DAYS){
    const st = dayStats(d);
    if(st.n){ pSum += st.p; pDays++; }
    if(st.ferm) fermDays++;
    for(const [m] of MEALS){ const e = effMeal(d, m); if(e) e.meal.novenyek.forEach(n => { const k = strip(n); if(k && !plants.has(k)) plants.set(k, n); }); }
  }
  for(const id of sel.snacks){ const s = MI[id]; if(s) s.novenyek.forEach(n => { const k = strip(n); if(k && !plants.has(k)) plants.set(k, n); }); }
  return {plants:[...plants.values()].sort((a,b) => a.localeCompare(b,'hu')), fermDays, avgP: pDays ? pSum / pDays : 0, pDays};
}

function gauge(label, val, min, max, unit){

    <div class="track"><div class="band" style="left:${pct(min)}%;width:${pct(max) - pct(min)}%"></div><div class="fill${low ? ' low' : ''}" style="width:${pct(val)}%"></div></div></div>`;
}

  const all = [...plan.etelek, ...plan.tartalekok];
  let list = all.filter(passFilters);
  const order = m => { const di = m.nap ? DAYS.findIndex(d => d[0] === m.nap) : 7; const mi = MEALS.findIndex(x => x[0] === m.etkezes); return di * 10 + mi + (m.ajanlott ? 0 : .5); };
  const sorters = {alap:(a,b) => order(a) - order(b), feherje:(a,b) => (b.feherje_g || 0) - (a.feherje_g || 0), ido:(a,b) => (a.ido_perc ?? 999) - (b.ido_perc ?? 999), kcal:(a,b) => (a.kcal ?? 9999) - (b.kcal ?? 9999)};
  list.sort(sorters[ui.sort] || sorters.alap);
  if(!list.length) return h + '<div class="card empty"><p class="muted">Nincs a szűrőknek megfelelő étel.</p></div>';
  const groups = new Map();
  const put = (g, m) => { if(!groups.has(g)) groups.set(g, []); groups.get(g).push(m); };
  if(ui.group === 'alapanyag'){
    const cnt = new Map();
    all.forEach(m => new Set(m.alapanyagok.map(i => strip(baseName(i.nev)))).forEach(k => { if(!SKIP_ING.test(k)) cnt.set(k, (cnt.get(k) || 0) + 1); }));
    const shown = new Map();
    list.forEach(m => m.alapanyagok.forEach(i => { const k = strip(baseName(i.nev)); if((cnt.get(k) || 0) >= 2 && !SKIP_ING.test(k)){ if(!shown.has(k)) shown.set(k, baseName(i.nev)); const arr = groups.get(shown.get(k)) || []; if(!arr.includes(m)) put(shown.get(k), m); } }));
    if(!groups.size) return h + '<div class="card empty"><p class="muted">Nincs olyan alapanyag, ami legalább 2 ételben szerepel.</p></div>';
    const sorted = [...groups.entries()].sort((a,b) => b[1].length - a[1].length || a[0].localeCompare(b[0],'hu'));
    groups.clear(); sorted.forEach(([k, v]) => groups.set(k, v));
  } else {
    const keyf = {
      nap: m => m.nap ? dayName(m.nap) : 'Tartalékok',
      nehezseg: m => m.nehezseg ? DIFF[m.nehezseg] : 'Nincs megadva',
      feherjeforras: m => m.feherjeforras || 'Nincs megadva',
      konyha: m => m.konyha || 'Nincs megadva',
      nova: m => m.nova ? 'NOVA ' + m.nova : 'Nincs megadva'
    }[ui.group] || (m => dayName(m.nap));
    let keys = [...new Set(list.map(keyf))];
    if(ui.group === 'nap'){ const o = [...DAYS.map(d => d[1]), 'Tartalékok']; keys.sort((a,b) => o.indexOf(a) - o.indexOf(b)); }
    else if(ui.group === 'nehezseg'){ const o = [...Object.values(DIFF), 'Nincs megadva']; keys.sort((a,b) => o.indexOf(a) - o.indexOf(b)); }
    else keys.sort((a,b) => a.localeCompare(b,'hu'));
    keys.forEach(k => groups.set(k, []));
    list.forEach(m => groups.get(keyf(m)).push(m));
  }
  for(const [g, ms] of groups){
    h += `<div class="groupname">${esc(g)}<span class="c">${ms.length} étel</span></div>`;
    h += ms.map(m => {
      const where = m.nap ? `${dayName(m.nap)} · ${mealName(m.etkezes)}` : `Tartalék · ${mealName(m.etkezes)}`;
      return mealCard(m, null).replace('<div class="chips">', `<div class="chips"><span class="chip">${esc(where)}</span>`);
    }).join('');
  }
  return h;
}

async function requestWake(){

}

/* ---------- időzítők ---------- */
let tickHandle = null;
function fmtLeft(ms){ const s = Math.max(0, Math.ceil(ms / 1000)); return String(Math.floor(s / 60)).padStart(2,'0') + ':' + String(s % 60).padStart(2,'0'); }
function startTimer(step){
  const m = MI[cook.id]; const s = m.lepesek[step]; if(!s || !s.perc) return;
  ensureAudio();
  const label = `${m.nev} – ${step + 1}. lépés`;
  timers.push({id:'t' + Date.now() + Math.random().toString(36).slice(2,6), key:m.id + '#' + step, label, end: Date.now() + s.perc * 60000, done:false});
  startTick(); renderCook(); renderTimerBar();
  toast(`⏱ ${s.perc} perces időzítő elindítva`);
}
function startTick(){ if(!tickHandle) tickHandle = setInterval(tick, 1000); }
function tick(){
  const now = Date.now();
  for(const t of timers){ if(!t.done && t.end <= now){ t.done = true; alarm(t); } }
  document.querySelectorAll('[data-tleft]').forEach(e => { const t = timers.find(x => x.id === e.dataset.tleft); if(t) e.textContent = t.done ? 'LEJÁRT' : fmtLeft(t.end - now); });
  if(!timers.length){ clearInterval(tickHandle); tickHandle = null; }
  renderTimerBar();
}
function timerListHTML(){
  return timers.map(t => `<div class="titem${t.done ? ' done' : ''}"><span class="tt" data-tleft="${t.id}">${t.done ? 'LEJÁRT' : fmtLeft(t.end - Date.now())}</span><span class="grow small">${esc(t.label)}</span><button class="btn sm" data-act="canceltimer" data-id="${t.id}">${t.done ? 'OK' : 'Leállít'}</button></div>`).join('');
}
function cancelTimer(id){
  timers = timers.filter(t => t.id !== id);
  if(cook) renderCook(); renderTimerBar();
  if(!timers.length && tickHandle){ clearInterval(tickHandle); tickHandle = null; }
}
function renderTimerBar(){
  const b = $('#timerbar');
  if(cook || !timers.length){ b.hidden = true; b.innerHTML = ''; return; }
  b.hidden = false;
  const now = Date.now();
  b.innerHTML = timers.slice(0, 3).map(t => `<button class="${t.done ? 'done' : ''}" data-act="${t.done ? 'canceltimer' : 'timerbar'}" data-id="${t.id}">⏱ ${t.done ? 'Lejárt ✓' : fmtLeft(t.end - now)}</button>`).join('');
  if(cook){ const c = $('#cookTimers'); if(c) c.innerHTML = timerListHTML(); }
}
function ensureAudio(){
  try{
    const AC = window.AudioContext || window.webkitAudioContext; if(!AC) return;
    if(!audioCtx) audioCtx = new AC();
    if(audioCtx.state === 'suspended') audioCtx.resume();
  }catch(e){}
}
function beep(){
  try{
    ensureAudio(); if(!audioCtx) return;
    const t0 = audioCtx.currentTime;
    for(let k = 0; k < 4; k++){
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = k % 2 ? 660 : 880;
      g.gain.setValueAtTime(0.0001, t0 + k*0.35); g.gain.exponentialRampToValueAtTime(0.4, t0 + k*0.35 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + k*0.35 + 0.28);
      o.connect(g).connect(audioCtx.destination); o.start(t0 + k*0.35); o.stop(t0 + k*0.35 + 0.3);
    }
  }catch(e){}
}
function alarm(t){
  try{ if(navigator.vibrate) navigator.vibrate([400,150,400,150,400]); }catch(e){}
  beep();
  toast('⏰ Lejárt: ' + t.label, 'alarm', 6000);
  if(cook) renderCook();
}

/* ---------- toast ---------- */
function toast(msg, cls, ms){
  const t = document.createElement('div'); t.className = 'toast' + (cls ? ' ' + cls : ''); t.textContent = msg;
  const box = $('#toasts'); box.appendChild(t);
  while(box.children.length > 3) box.firstElementChild.remove();
  setTimeout(() => t.remove(), ms || 2800);
}

  try{
    if(!navigator.clipboard || !window.isSecureContext) throw new Error('no clipboard');
    await navigator.clipboard.writeText(txt); toast(label + ' a vágólapon ✓');
  }catch(e){
    openSheet(label, `<p class="small muted" style="margin-top:0">A böngésző nem engedte az automatikus másolást – jelöld ki és másold ki kézzel.</p><textarea class="copybox" readonly style="min-height:260px">${esc(txt)}</textarea>`);

/* ---------- költségkövetés (becslés a usage mezőkből) ---------- */
function monthKey(){ return isoDate(new Date()).slice(0, 7); }
function monthUsage(){ return usage[monthKey()] || {usd:0, calls:0, searches:0}; }
function trackUsage(model, u){
  if(!u) return 0;
  const [, , , pin, pout] = modelInfo(model);
  const s = (u.server_tool_use && u.server_tool_use.web_search_requests) || 0;
  const cost = ((u.input_tokens || 0) * pin + (u.cache_creation_input_tokens || 0) * pin * 1.25 + (u.cache_read_input_tokens || 0) * pin * 0.1 + (u.output_tokens || 0) * pout) / 1e6 + s * WEB_SEARCH_USD;
  const k = monthKey(), m = usage[k] || {usd:0, calls:0, searches:0};
  m.usd += cost; m.calls++; m.searches += s; usage[k] = m;
  Object.keys(usage).sort().slice(0, -6).forEach(x => delete usage[x]);
  store.set('usage', usage);
  return cost;
}

/* ---------- hibák ---------- */
class AiError extends Error{ constructor(msg, o){ super(msg); Object.assign(this, {status:0, type:'', retry:false, retryAfter:null}, o || {}); } }
function aiErrText(status, type, msg){
  msg = msg || '';
  if(status === 401 || type === 'authentication_error') return 'Érvénytelen API-kulcs – a Több fülön ellenőrizhető.';
  if(/credit balance|billing|purchase credits/i.test(msg)) return 'Nincs elérhető API-kredit. A Max-kreditet a claude.ai → Beállítások → Billing → API credits → „Link organization” résznél kell összekötni a Console-szervezettel (vagy elfogyott a havi keret).';
  if(status === 403 || type === 'permission_error') return 'A kulcsnak nincs jogosultsága ehhez' + (msg ? ': ' + msg : '.');
  if(status === 404 || type === 'not_found_error') return 'Nem található modell vagy végpont' + (msg ? ` (${msg})` : '') + ' – a Több fülön másik modell választható.';
  if(status === 413) return 'Túl nagy kérés.';
  if(status === 429 || type === 'rate_limit_error') return 'Sebességkorlát (rate limit) – rövid várakozás után újrapróbálom.';
  if(status === 529 || type === 'overloaded_error') return 'A Claude most túlterhelt – újrapróbálom.';
  if(status >= 500) return `Szerverhiba (${status}) – újrapróbálom.`;
  if(status === 400) return 'Hibás kérés: ' + msg;
  return msg || 'Ismeretlen hiba.';
}
function abortError(){ const e = new Error('Megszakítva'); e.name = 'AbortError'; return e; }
function sleep(ms, signal){
  return new Promise((res, rej) => {
    if(signal && signal.aborted) return rej(abortError());
    const t = setTimeout(res, ms);
    if(signal) signal.addEventListener('abort', () => { clearTimeout(t); rej(abortError()); }, {once:true});
  });
}

/* ---------- Messages API, streaming ---------- */
async function callClaude(o){
  if(!ai.key) throw new AiError('Nincs beállítva Claude API-kulcs (Több → Claude AI).', {type:'nokey'});
  const body = {model:o.model || mainModel(), max_tokens:o.max_tokens || 2000, stream:true, messages:o.messages};
  if(o.system) body.system = o.system;
  if(o.tools) body.tools = o.tools;
  if(o.tool_choice) body.tool_choice = o.tool_choice;
  // saját megszakító: a külső (felhasználói) megszakítás + őrkutya, ha 90 mp-ig nem jön adat
  const ctl = new AbortController();
  let timedOut = false, wd = null;
  const kick = () => { clearTimeout(wd); wd = setTimeout(() => { timedOut = true; ctl.abort(); }, 90000); };
  const onOuter = () => ctl.abort();
  if(o.signal){ if(o.signal.aborted) throw abortError(); o.signal.addEventListener('abort', onOuter, {once:true}); }
  const cleanup = () => { clearTimeout(wd); if(o.signal) o.signal.removeEventListener('abort', onOuter); };
  const toErr = e => (timedOut ? new AiError('Nem jött válasz 90 másodpercig – újrapróbálom.', {type:'timeout', retry:true}) : e);
  kick();
  let res;
  try{
    res = await fetch(String(ai.endpoint || 'https://api.anthropic.com').replace(/\/+$/, '') + '/v1/messages', {
      method:'POST', signal:ctl.signal,
      headers:{'content-type':'application/json', 'x-api-key':ai.key, 'anthropic-version':'2023-06-01', 'anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify(body)
    });
  }catch(e){
    cleanup();
    if(timedOut) throw toErr(e);
    if(e.name === 'AbortError') throw e;
    throw new AiError('Nem érhető el a Claude API (nincs internet, vagy megszakadt a kapcsolat).', {type:'network', retry:true});
  }
  if(!res.ok){
    cleanup();
    let j = null; try{ j = await res.json(); }catch(e){}
    const type = (j && j.error && j.error.type) || '', msg = (j && j.error && j.error.message) || '';
    const retry = [408, 409, 429, 500, 502, 503, 504, 529].includes(res.status) || type === 'overloaded_error';
    throw new AiError(aiErrText(res.status, type, msg), {status:res.status, type, retry, retryAfter:num(res.headers.get('retry-after'))});
  }
  const msg = {content:[], stop_reason:null, usage:{}}, partial = {};
  let chars = 0, ended = false, buf = '';
  const onEvent = ev => {
    if(ev.type === 'message_start') Object.assign(msg.usage, (ev.message && ev.message.usage) || {});
    else if(ev.type === 'content_block_start'){
      const b = Object.assign({}, ev.content_block); msg.content[ev.index] = b;
      if(b.type === 'tool_use' || b.type === 'server_tool_use') partial[ev.index] = '';
      if(b.type === 'text') b.text = b.text || '';
    }
    else if(ev.type === 'content_block_delta'){
      const b = msg.content[ev.index], d = ev.delta || {};
      if(!b) return;
      if(d.type === 'text_delta'){ b.text += d.text; chars += d.text.length; o.onProgress && o.onProgress(chars, b.text); }
      else if(d.type === 'input_json_delta'){ partial[ev.index] += d.partial_json; chars += d.partial_json.length; o.onProgress && o.onProgress(chars, null); }
    }
    else if(ev.type === 'content_block_stop'){
      if(partial[ev.index] != null){ const b = msg.content[ev.index]; try{ b.input = partial[ev.index] ? JSON.parse(partial[ev.index]) : {}; }catch(e){ b.input = null; } }
    }
    else if(ev.type === 'message_delta'){ if(ev.delta && ev.delta.stop_reason) msg.stop_reason = ev.delta.stop_reason; if(ev.usage) Object.assign(msg.usage, ev.usage); }
    else if(ev.type === 'message_stop') ended = true;
    else if(ev.type === 'error'){ const er = ev.error || {}; throw new AiError(aiErrText(0, er.type, er.message), {type:er.type, retry:['overloaded_error', 'api_error', 'rate_limit_error'].includes(er.type)}); }
  };
  try{
    const reader = res.body.getReader(), dec = new TextDecoder();
    for(;;){
      const {done, value} = await reader.read();
      kick();
      if(value) buf += dec.decode(value, {stream:true}).replace(/\r/g, '');
      let i;
      while((i = buf.indexOf('\n\n')) >= 0){
        const raw = buf.slice(0, i); buf = buf.slice(i + 2);
        const data = raw.split('\n').filter(l => l.startsWith('data:')).map(l => l.slice(5).trim()).join('');
        if(!data) continue;
        let ev; try{ ev = JSON.parse(data); }catch(e){ continue; }
        onEvent(ev);
      }
      if(done) break;
    }
  }catch(e){
    cleanup();
    if(timedOut) throw toErr(e);
    if(e instanceof AiError || e.name === 'AbortError') throw e;
    throw new AiError('A kapcsolat megszakadt a válasz közben.', {type:'network', retry:true});
  }
  cleanup();
  trackUsage(body.model, msg.usage);
  if(!ended && !msg.stop_reason) throw new AiError('A válasz félbeszakadt.', {type:'network', retry:true});
  msg.content = msg.content.filter(Boolean);
  if(msg.stop_reason === 'refusal') throw new AiError('A Claude ezt a kérést nem teljesítette.', {type:'refusal'});
  return msg;
}
async function withRetry(fn, o = {}){
  const tries = o.tries || 5; let delay = 3000;
  for(let k = 0; ; k++){
    const gate = rlUntil - Date.now();
    if(gate > 0){ o.onWait && o.onWait(gate); await sleep(gate, o.signal); }
    try{ return await fn(k); }
    catch(e){
      if(e.name === 'AbortError' || !e.retry || k >= tries - 1) throw e;
      const wait = e.retryAfter ? e.retryAfter * 1000 : e.status === 429 ? 15000 * (k + 1) : delay * (1 + Math.random() * 0.4);
      if(e.status === 429) rlUntil = Math.max(rlUntil, Date.now() + wait);
      o.onWait && o.onWait(wait, e);
      await sleep(wait, o.signal);
      delay = Math.min(delay * 2, 60000);
    }
  }
}
/* kötelező eszközhívás (tool_use) → biztosan géppel olvasható JSON */
function callTool(o, name, validate){
  return withRetry(async k => {
    const msg = await callClaude(Object.assign({}, o, {max_tokens:Math.min(8000, (o.max_tokens || 4000) + k * 1500), tool_choice:{type:'tool', name}}));
    if(msg.stop_reason === 'max_tokens') throw new AiError('A válasz túl hosszú lett – újrapróbálom nagyobb kerettel.', {type:'max_tokens', retry:true});
    const b = msg.content.find(c => c.type === 'tool_use' && c.name === name);
    if(!b || !b.input || typeof b.input !== 'object') throw new AiError('A Claude nem adott értelmezhető választ – újrapróbálom.', {type:'bad_output', retry:true});
    const err = validate && validate(b.input);
    if(err) throw new AiError(err, {type:'bad_output', retry:true});
    return b.input;
  }, {signal:o.signal, onWait:o.onWait, tries:o.tries});
}

function targets(){
  const w = num(profile.suly), h = num(profile.magassag), a = num(profile.kor);
  if(w && h && a){
    const bmr = 10 * w + 6.25 * h - 5 * a + (profile.nem === 'nő' ? -161 : 5), r = x => Math.round(x / 50) * 50;
    let kmin = r(bmr * 1.375), kmax = r(bmr * 1.5), fmin = 1.4, fmax = 1.8;

    for(const b of msg.content) if(b.type === 'web_search_tool_result' && Array.isArray(b.content)) for(const r of b.content) if(r && r.url) found.set(normUrl(r.url), r);
    const t = msg.content.find(b => b.type === 'tool_use' && b.name === 'link_valasz');
    if(t){
      const u = String((t.input && t.input.url) || '').trim(), hit = u ? found.get(normUrl(u)) : null;
      if(!hit) return null;   // nem a találatok közül való → eldobjuk
      return {url:hit.url, cim:String((t.input && t.input.cim) || hit.title || hit.url).slice(0, 160)};
    }
    if(msg.stop_reason === 'pause_turn' || (round === 0 && msg.stop_reason === 'end_turn')){
      messages = messages.concat([{role:'assistant', content:cleanBlocks(msg.content)}]);
      if(msg.stop_reason !== 'pause_turn') messages.push({role:'user', content:'Add meg az eredményt a link_valasz eszközzel.'});
      continue;
    }
    return null;
  }
  return null;
}

  const send = st.msgs.map(x => ({role:x.role, content:x.content}));

      }});

    const text = msg.content.filter(b => b.type === 'text').map(b => b.text).join('').trim() || '(üres válasz)';
    if(started) st.msgs[st.msgs.length - 1].content = text; else st.msgs.push({role:'assistant', content:text});

}

      <span class="small muted">${String(ai.customModel || '').trim() ? `Egyedi modell van beállítva: ${esc(ai.customModel)} · ` : ''}$${pr(mi[3])} bemenet / $${pr(mi[4])} kimenet millió tokenenként · egy heti terv ≈ ${usd(estimate().plan)}</span></div>
    <div class="field col"><div class="row"><span class="grow">Ebben a hónapban (becslés)</span><b>${usd(mu.usd)}</b><span class="muted">/ $${cap}</span></div>
      <div class="bar2"><i class="${mu.usd > cap ? 'over' : ''}" style="width:${Math.min(100, mu.usd / cap * 100)}%"></i></div>
      <span class="small muted">${mu.calls} hívás, ${mu.searches} webkeresés · a pontos egyenleg a Claude Console-ban látszik</span></div>
    ${ai.key ? `<div class="field col"><div class="row wrap"><button class="btn ai" data-act="genopen">✨ Új hét generálása</button>${linkBulkBtn()}</div></div>` : ''}
    <details class="field col"><summary>Haladó beállítások</summary>
      <label class="lbl">API-cím</label><input class="txt" data-ai="endpoint" value="${esc(ai.endpoint)}" autocapitalize="off" spellcheck="false">
      <label class="lbl">Egyedi modellazonosító (felülírja a fentit)</label><input class="txt" data-ai="customModel" value="${esc(ai.customModel)}" placeholder="pl. claude-sonnet-5-5" autocapitalize="off" spellcheck="false">
      <label class="lbl">Linkkereső modell</label><select class="txt" data-ai="linkModel">${opts(ai.linkModel)}</select>
      <label class="lbl">Párhuzamos kérések (1–4)</label><input class="txt short" data-ai="conc" type="number" min="1" max="4" value="${esc(ai.conc)}">
      <label class="lbl">Havi API-keret ($)</label><input class="txt short" data-ai="keret" type="number" min="1" value="${esc(ai.keret)}">
    </details>
  </div>`;
}
function profileHTML(){
  const p = profile, t = targets();
  const inp = (k, label, type, ph) => `<div class="field"><span>${label}</span><input class="txt short" data-pf="${k}" type="${type}" ${type === 'number' ? 'inputmode="decimal"' : ''} value="${esc(p[k])}" placeholder="${esc(ph)}"></div>`;
  return `<div class="sec-title">🙋 Rólam<span class="r small">csak ezen az eszközön tárolódik</span></div><div class="card">
    <div class="field"><span>Nem</span><div class="seg" style="width:160px">${['férfi', 'nő'].map(v => `<button data-act="pf" data-k="nem" data-id="${v}" aria-pressed="${p.nem === v}">${v}</button>`).join('')}</div></div>
    ${inp('kor', 'Kor (év)', 'number', 'pl. 30')}${inp('magassag', 'Magasság (cm)', 'number', 'pl. 175')}${inp('suly', 'Testsúly (kg)', 'number', 'pl. 70')}${inp('futas', 'Futás / hét', 'text', 'pl. 1–2')}
    <div class="field"><span>Cél</span><select class="txt short" data-pf="cel">${['szinten tartás', 'izomépítés', 'fogyás'].map(v => `<option${p.cel === v ? ' selected' : ''}>${v}</option>`).join('')}</select></div>
    <div class="field"><span class="small muted">Napi cél${num(p.suly) && num(p.magassag) && num(p.kor) ? ' (számított)' : ' (alap)'}</span><b class="small targets">${t.feherje_min}–${t.feherje_max} g fehérje · ${t.kcal_min}–${t.kcal_max} kcal</b></div>
    ${inp('bolt', 'Bolt', 'text', 'pl. Lidl (Budapest)')}
    <div class="field col"><span>Nem eszem / kerülendő</span><textarea class="txt" data-pf="kerulendo" rows="2" placeholder="pl. nyers hagyma, koriander">${esc(p.kerulendo)}</textarea></div>
    <div class="field col"><span>Kedvencek, ízlés</span><textarea class="txt" data-pf="kedvelt" rows="2" placeholder="pl. csípős, sok zöldfűszer">${esc(p.kedvelt)}</textarea></div>
    <div class="field col"><span>Saját szabályok</span><textarea class="txt" data-pf="szabalyok" rows="6">${esc(p.szabalyok)}</textarea><button class="btn sm ghost" data-act="rulesreset" style="align-self:flex-start">Alapértelmezett szabályok</button></div>
  </div>`;
}
function downloadText(name, text){
  const blob = new Blob([text], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function exportPlan(){
  if(!plan) return;
  const conv = x => { const o = Object.assign({}, x); o.nutriscore_becsult = o.nutriscore; delete o.nutriscore; delete o.kind; if(!o.nap) delete o.nap; if(!o.lepesek_eredeti) delete o.lepesek_eredeti; return o; };
  const out = {ev:plan.ev, het:plan.het, kezdo_datum:plan.kezdo_datum, generalva:plan.generalva, tema:plan.tema, megjegyzesek:plan.megjegyzesek, napi_cel:plan.napi_cel, futonap_tipp:plan.futonap_tipp, meal_prep:plan.meal_prep,
    etelek:plan.etelek.map(conv), tartalekok:plan.tartalekok.map(conv), snackek:plan.snackek.map(conv)};
  downloadText('week.json', JSON.stringify(out, null, 1)); toast('week.json letöltve');
}

/* ---------- események ---------- */
function toggleArr(arr, v){ const i = arr.indexOf(v); if(i >= 0) arr.splice(i, 1); else arr.push(v); }
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if(!t) return;
  if(t.tagName === 'SELECT') return;
  const a = t.dataset.act, id = t.dataset.id;
  switch(a){
    case 'tab': ui.tab = id; saveUI(); renderAll(); window.scrollTo(0, 0); break;
    case 'view': ui.view = id; saveUI(); renderAll(); break;
    case 'day': ui.day = id; renderAll(); break;
    case 'toggle': toggleArr(ui.open, id); saveUI(); renderAll(); break;
    case 'prep': ui.prepOpen = !ui.prepOpen; saveUI(); renderAll(); break;
    case 'prepcheck': { const i = t.dataset.i; sel.prep[i] = !sel.prep[i]; saveSel(); renderAll(); break; }
    case 'select': sel.slots[t.dataset.slot] = id; saveSel(); renderAll(); toast('Kiválasztva: ' + MI[id].nev); break;
    case 'unselect': delete sel.slots[t.dataset.slot]; saveSel(); renderAll(); break;
    case 'swap': openSwap(t.dataset.slot); break;
    case 'swappick': doSwap(t.dataset.slot, id); break;
    case 'closesheet': closeSheet(); break;
    case 'cook': openCook(id); break;
    case 'closecook': closeCook(); break;
    case 'cooknext': cook.step++; renderCook(); $('#cook .cook-b').scrollTop = 0; break;
    case 'cookprev': cook.step = Math.max(0, cook.step - 1); renderCook(); break;
    case 'starttimer': startTimer(+t.dataset.step); break;
    case 'canceltimer': cancelTimer(id); break;
    case 'timerbar': { const tm = timers.find(x => x.id === id); if(tm){ const mid = tm.key.split('#')[0]; openCook(mid); cook.step = +tm.key.split('#')[1]; renderCook(); } break; }
    case 'rate': { const m = MI[id]; const k = strip(m.nev); if(ratings[k] && ratings[k].v === t.dataset.v) delete ratings[k]; else ratings[k] = {v:t.dataset.v, nev:m.nev, t:Date.now()}; store.set('ratings', ratings); renderAll(); break; }
    case 'filter': toggleArr(ui.filters, id); saveUI(); renderAll(); break;
    case 'snacklist': toggleArr(sel.snacks, id); saveSel(); renderAll(); toast(sel.snacks.includes(id) ? 'Listára téve' : 'Levéve a listáról'); break;
    case 'check': checks.items[id] = !checks.items[id]; if(!checks.items[id]) delete checks.items[id]; store.set('checks', checks); renderAll(); break;
    case 'pantry': if(!pantry.some(p => strip(p) === strip(id))) pantry.push(id); store.set('pantry', pantry); renderAll(); toast(`🏠 ${id}: otthon van`); break;
    case 'unpantry': pantry = pantry.filter(p => strip(p) !== strip(id)); store.set('pantry', pantry); renderAll(); break;
    case 'fillrec': { let n = 0; for(const [d] of DAYS) for(const [m] of MEALS){ const k = slotKey(d, m); if(!sel.slots[k]){ const r = plan.etelek.find(x => x.nap === d && x.etkezes === m && x.ajanlott); if(r){ sel.slots[k] = r.id; n++; } } } saveSel(); renderAll(); toast(n ? `${n} üres helyre került az ajánlott` : 'Nincs üres hely'); break; }
    case 'copylist': copyText(listText(), 'Bevásárlólista'); break;
    case 'clearchecks': checks.items = {}; store.set('checks', checks); renderAll(); toast('Pipák törölve'); break;
    case 'pickfile': $('#fileInput').click(); break;
    case 'restore': $('#restoreInput').click(); break;
    case 'serverfetch': fetchServerWeek(true); break;
    case 'demo': loadPlan(JSON.parse(JSON.stringify(DEMO))); ui.tab = 'het'; saveUI(); renderAll(); break;
    case 'pasteload': { const v = $('#pasteBox').value; if(!v.trim()){ toast('Előbb illeszd be a JSON-t'); break; } try{ loadPlan(v); ui.tab = 'het'; saveUI(); renderAll(); }catch(err){ toast('Hibás JSON: ' + err.message, null, 5000); } break; }
    case 'fo': settings.fo = +id; store.set('settings', settings); renderAll(); break;
    case 'tema': settings.tema = id; store.set('settings', settings); renderAll(); break;
    case 'plants': ui.plantsOpen = !ui.plantsOpen; saveUI(); renderAll(); break;
    case 'feedback': copyText(feedbackText(), 'Visszajelzés'); break;
    case 'backupdl': downloadBackup(); break;
    case 'backupcopy': copyText(JSON.stringify(backupObj()), 'Mentés'); break;
    case 'genopen': openGen(); break;
    case 'gentarget': genOpt.target = +id; openGen(); break;
    case 'genrun': toggleArr(profile.futonapok, id); store.set('profile', profile); openGen(); break;
    case 'genstart': { const l = $('#genLinks'), x = $('#genExtra'); if(l) genOpt.links = l.checked; if(x) genOpt.extra = x.value; startJob(); break; }
    case 'jobresume': runJob(); break;
    case 'jobcancel': if(confirm('Biztosan megszakad a generálás? Az eddig kész részek elvesznek.')) cancelJob(); break;
    case 'jobskiplinks': if(job){ job.skipLinks = true; if(jobCtl) jobCtl.abort(); else { finishJob(); renderAll(); } } break;
    case 'aidetail': aiDetail(id); break;
    case 'ailink': aiLink(id); break;
    case 'ask': openAsk(id); break;
    case 'askchip': askSend(ASK_CHIPS[+t.dataset.i]); break;
    case 'asksend': { const v = $('#askInput'); askSend(v && v.value); break; }
    case 'aialt': { const w = $('#wishText'); if(w) swapUI.text = w.value; aiAlternatives(t.dataset.slot); break; }
    case 'wish': { const w = $('#wishText'); if(w) swapUI.text = w.value; toggleArr(swapUI.wish, id); rerenderSwap(); break; }
    case 'aikeysave': { const v = (($('#aiKey') || {}).value || '').trim(); if(!v){ toast('A kulcs mező üres'); break; } ai.key = v; store.set('ai', ai); renderAll(); toast(v.startsWith('sk-ant-') ? 'Kulcs elmentve – érdemes tesztelni' : 'Elmentve, de a Claude API-kulcs általában „sk-ant-” kezdetű', null, 4000); break; }
    case 'aikeydel': if(confirm('Törlődjön az API-kulcs erről az eszközről?')){ ai.key = ''; store.set('ai', ai); renderAll(); } break;
    case 'aitest': aiTest(); break;
    case 'bulklinks': bulkLinks(); break;
    case 'pf': profile[t.dataset.k] = id; store.set('profile', profile); renderAll(); break;
    case 'rulesreset': profile.szabalyok = DEFAULT_RULES; store.set('profile', profile); renderAll(); toast('Alapértelmezett szabályok visszaállítva'); break;
    case 'exportplan': exportPlan(); break;
    case 'wipe': if(confirm('Biztosan törlöd az összes adatot (terv, választások, értékelések, kamra, előzmények)?')){ store.keys().forEach(k => localStorage.removeItem(k)); location.reload(); } break;
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if(t.matches('select[data-act="group"]')){ ui.group = t.value; saveUI(); renderAll(); }
  else if(t.matches('select[data-act="sort"]')){ ui.sort = t.value; saveUI(); renderAll(); }
  else if(t.id === 'keretInput'){ const v = Math.max(0, Math.round(num(t.value) || 0)); settings.keret = v; store.set('settings', settings); toast('Heti keret: ' + fmtFt(v)); }
  else if(t.matches('[data-pf]')){ profile[t.dataset.pf] = t.value.trim(); store.set('profile', profile); renderAll(); }
  else if(t.matches('[data-ai]')){
    const k = t.dataset.ai; let v = t.value.trim();
    if(k === 'conc') v = Math.max(1, Math.min(4, Math.round(num(v) || 3)));
    if(k === 'keret') v = Math.max(1, num(v) || 100);
    if(k === 'endpoint' && !v) v = 'https://api.anthropic.com';
    ai[k] = v; store.set('ai', ai); if(k !== 'endpoint' && k !== 'customModel') renderAll();
  }
  else if(t.id === 'genLinks'){ genOpt.links = t.checked; const x = $('#genExtra'); if(x) genOpt.extra = x.value; openGen(); }
  else if(t.id === 'fileInput' || t.id === 'restoreInput'){
    const f = t.files && t.files[0]; if(!f) return;
    const isRestore = t.id === 'restoreInput';
    f.text().then(txt => {
      try{ if(isRestore) restoreBackup(txt); else { loadPlan(txt); ui.tab = 'het'; saveUI(); renderAll(); } }
      catch(err){ toast((isRestore ? 'Hibás mentés: ' : 'Hibás JSON: ') + err.message, null, 5000); }
    }).finally(() => { t.value = ''; });
  }
});
$('#sheet').addEventListener('click', e => { if(e.target.id === 'sheet') closeSheet(); });
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible'){
    if(cook) requestWake();
    if(timers.length) tick();
    fetchServerWeek(false);
    if(job && !jobRunning && !job.error && aiOn()) runJob();
  }
});
document.addEventListener('input', e => {
  if(e.target.id === 'wishText') swapUI.text = e.target.value;
  else if(e.target.id === 'genExtra') genOpt.extra = e.target.value;
  else if(e.target.id === 'askInput' && askState) askState.draft = e.target.value;
});
document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){ if(!$('#sheet').hidden) closeSheet(); else if(cook) closeCook(); }
  if(e.key === 'Enter' && !e.shiftKey && e.target.id === 'askInput'){ e.preventDefault(); askSend(e.target.value); return; }
  if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  if(cook && e.key === 'ArrowRight'){ const m = MI[cook.id]; if(cook.step < m.lepesek.length - 1){ cook.step++; renderCook(); } }
  if(cook && e.key === 'ArrowLeft' && cook.step > 0){ cook.step--; renderCook(); }
});

/* ---------- indulás ---------- */
(function init(){
  if(plan){
    try{ plan = normalizePlan(plan); }catch(e){ plan = null; }
  }
  rebuildIndex();
  if(plan) ensureWeekState();
  ui.day = defaultDay();
  if(!['het','bev','snack','tobb'].includes(ui.tab)) ui.tab = 'het';
  renderAll();
  fetchServerWeek(false);
  // félbemaradt generálás folytatása (bezárt app / megszakadt kérés után is)
  if(job && job.phase !== 'kesz' && aiOn()){ job.error = null; saveJob(); setTimeout(runJob, 600); }
  if('serviceWorker' in navigator && location.protocol !== 'file:'){
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
})();
</script>
